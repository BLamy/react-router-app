name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Replay Chromium
        run: npx replayio install

      - run: npm run build

      - name: Start server
        run: PORT=4321 npm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:4321

      - name: Run E2E tests with Replay
        run: npx playwright test --project replay-chromium --reporter=@replayio/playwright/reporter,line

      - name: Upload failed replays to Replay.io
        if: always()
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.REPLAY_API_KEY }}
          filter: "function($v) { $v.metadata.test.result = \"failed\" }"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
