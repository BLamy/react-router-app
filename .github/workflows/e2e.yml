name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - run: pnpm run build

      - name: Start server
        run: PORT=4321 pnpm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:4321

      - name: Generate Replay test run ID
        id: replay-test-run-id
        run: echo "value=$(node -p 'require(\"node:crypto\").randomUUID()')" >> "$GITHUB_OUTPUT"

      - name: Run E2E tests with Replay
        id: tests
        continue-on-error: true
        env:
          RECORD_REPLAY_TEST_RUN_ID: ${{ steps.replay-test-run-id.outputs.value }}
        run: |
          npx replayio install
          pnpm exec playwright test \
            --project replay-chromium \
            --reporter=line,@replayio/playwright/reporter

      - name: Upload failed replays to Replay.io
        if: always()
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.RECORD_REPLAY_API_KEY }}
          filter: 'function($v) { $v.metadata.test.result = "failed" }'

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
