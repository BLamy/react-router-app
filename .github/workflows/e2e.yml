name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Replay Chromium
        run: npx replayio install

      - run: pnpm run build

      - name: Start server
        run: PORT=4321 pnpm run start &

      - name: Wait for server
        run: npx wait-on http://localhost:4321

      - name: Run E2E tests with Replay
        id: tests
        continue-on-error: true
        run: pnpm exec playwright test --project replay-chromium --reporter=@replayio/playwright/reporter,line

      - name: Upload failed replays to Replay.io
        if: always()
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.RECORD_REPLAY_API_KEY }}
          filter: "function($v) { $v.metadata.test.result = \"failed\" }"

      - name: Analyze failures and auto-fix with Claude Code
        if: steps.tests.outcome == 'failure'
        env:
          RECORD_REPLAY_API_KEY: ${{ secrets.RECORD_REPLAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Get recording IDs from local replay recordings
          RECORDING_IDS=$(npx @replayio/replay ls --json 2>/dev/null | jq -r '.[].id' || true)

          if [ -z "$RECORDING_IDS" ]; then
            echo "No recordings found, skipping analysis"
            exit 0
          fi

          # Collect all analyses
          ANALYSES=""
          for RECORDING_ID in $RECORDING_IDS; do
            echo "Analyzing recording: $RECORDING_ID"
            ANALYSIS=$(curl -s "https://dispatch.replay.io/nut/recording/${RECORDING_ID}/analyze" \
              -H 'Content-Type: application/x-ndjson' \
              -H "Authorization: Bearer ${RECORD_REPLAY_API_KEY}" \
              --data-raw '{"goal":"what happened here"}')
            ANALYSES="${ANALYSES}\n--- Recording ${RECORDING_ID} ---\n${ANALYSIS}\n"
          done

          echo "All analyses collected:"
          echo -e "$ANALYSES"

          # Create a fix branch
          FIX_BRANCH="auto-fix/e2e-$(date +%s)"
          git checkout -b "$FIX_BRANCH"

          # Run Claude Code to fix the issues
          npx @anthropic-ai/claude-code@latest -p "
          You are fixing failing E2E tests in a React Router app.

          Here are the Replay.io analyses of the failing tests:

          $(echo -e "$ANALYSES")

          Look at the test files in e2e/ and the app code in app/ to understand what's wrong.
          Fix the application code (not the tests) to make the failing tests pass.
          Only modify files that need changes. Be minimal and precise.
          " --allowedTools "Edit,Read,Glob,Grep,Write"

          # Check if claude-code made any changes
          if git diff --quiet; then
            echo "No changes made by Claude Code"
            exit 0
          fi

          # Commit and push fixes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix failing E2E tests based on Replay analysis

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin "$FIX_BRANCH"

          # Create PR
          gh pr create \
            --title "fix: auto-fix failing E2E tests" \
            --body "## Summary
          Automated fix for failing E2E tests based on Replay.io recording analysis.

          - Replay.io analyzed the test failures
          - Claude Code generated fixes based on the analysis

          ## Test plan
          - [ ] Review the changes
          - [ ] Verify E2E tests pass on this branch

          Generated automatically by CI" \
            --base "$BASE_BRANCH"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
