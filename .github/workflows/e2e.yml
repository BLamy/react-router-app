name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Install Replay Chromium
        run: pnpm exec replayio install

      - run: pnpm run build

      - name: Start server
        run: PORT=4321 pnpm run start &

      - name: Wait for server
        run: pnpm exec wait-on http://localhost:4321

      - name: Run E2E tests with Replay
        run: pnpm exec playwright test --project replay-chromium --reporter=@replayio/playwright/reporter,line

      - name: Upload failed replays to Replay.io
        if: always()
        uses: replayio/action-upload@v0.5.1
        with:
          api-key: ${{ secrets.RECORD_REPLAY_API_KEY }}
          filter: "function($v) { $v.metadata.test.result = \"failed\" }"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
